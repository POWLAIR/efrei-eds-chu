name: eds-chu

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: eds-clickhouse
    restart: on-failure:5   # 1er boot sur petite VM : parfois transitoire
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"   # UI SQL : http://localhost:8123/play
      - "${CH_TCP_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: "${CH_USER:-eds}"
      CLICKHOUSE_PASSWORD: "${CH_PASSWORD:-eds}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      # Le lake est monté en lecture seule : ClickHouse lit les fichiers via file()
      - ./data/lake:/var/lib/clickhouse/user_files/lake:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CH_USER:-eds}", "--password", "${CH_PASSWORD:-eds}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  metabase:
    # >= v0.54 : le driver ClickHouse est intégré au cœur (aucun JAR à monter)
    image: metabase/metabase:v0.63.15.5
    container_name: eds-metabase
    restart: unless-stopped
    ports:
      - "${MB_PORT:-3000}:3000"
    volumes:
      - mb-data:/metabase-data
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: "-Xmx1g"             # VM ~4 Go partagée avec ClickHouse
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch-data:
  ch-logs:
  mb-data:
